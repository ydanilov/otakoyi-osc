name: Bump design system

# The design system lives in the public ydanilov/otakoyi-controls repo, checked out here as the
# `design-system` submodule (ADR-019). Every Monday (or by hand) this moves the submodule to the
# latest public `main` and opens a PR, so CI runs the whole product against the new design system.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Move the submodule to otakoyi-controls main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          before=$(git -C design-system rev-parse HEAD)
          git submodule update --remote design-system
          after=$(git -C design-system rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "Design system unchanged ($before)."
            exit 0
          fi
          log=$(git -C design-system log --oneline "$before..$after")
          branch="chore/design-system-${after:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add design-system
          git commit -m "chore(design-system): bump to ${after:0:7}"
          git push -u origin "$branch"
          {
            echo "Moves \`design-system\` to otakoyi-controls \`${after:0:7}\`:"
            echo
            echo '```'
            echo "$log"
            echo '```'
          } > body.md
          gh pr create --title "chore(design-system): bump to ${after:0:7}" --body-file body.md
